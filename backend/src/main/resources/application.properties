spring.application.name=peer-tutoring-board
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Environment ----
app.env=${APP_ENV:local}

# ---- Time Zone ----
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# ---- PostgreSQL (overridable via environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peertutor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Force UTC so PostgreSQL doesn't reject the Windows JVM timezone (Asia/Calcutta)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:https://teamheurigon.vercel.app}
app.cors.allowed-origin-patterns=${CORS_ORIGIN_PATTERNS:}

# ---- Springdoc / Swagger UI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Slot rules ----
app.slot.min-lead-minutes=2
app.slot.min-duration-minutes=5

# ---- Chat ----
app.chat.window-hours=24

# ---- MVC Error Handling ----
spring.mvc.throw-exception-if-no-handler-found=true

