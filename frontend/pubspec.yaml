name: peer_tutoring_board
description: StudyCircle - Connect students with peer tutors on campus.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.0
  go_router: ^14.0.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/landing/
